# EXAMPLE workflow: auto-export .drawio files to PNG/SVG on push.
# NOTE: This is a template example. You must verify and adjust the export command or action
# to match the CLI or Docker image you prefer for headless export (see diagrams.net docs).
name: Export diagrams

on:
  push:
    paths:
      - 'diagrams/**.drawio'
      - '.github/workflows/export-diagrams.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create exported directory
        run: mkdir -p diagrams/exported

      # Example using a container that can run the draw.io headless exporter.
      # Replace the image/command below with the exporter you choose.
      - name: Export .drawio -> PNG and SVG (example)
        run: |
          # This is an example command — replace with a verified CLI or Docker image that provides 'drawio' command.
          for f in diagrams/*.drawio; do
            fname=$(basename "$f" .drawio)
            docker run --rm -v "${{ github.workspace }}:/data" jgraph/drawio:latest \
              --export --format png --output /data/diagrams/exported/"${fname}".png /data/"$f"
            docker run --rm -v "${{ github.workspace }}:/data" jgraph/drawio:latest \
              --export --format svg --output /data/diagrams/exported/"${fname}".svg /data/"$f"
          done

      - name: Commit exported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/exported/*
          if ! git diff --cached --quiet; then
            git commit -m "chore: update exported diagrams" || true
            git push
          else
            echo "No changes to exported diagrams."
          fi